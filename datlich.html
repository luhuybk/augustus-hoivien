<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0e0c" id="tc">
<meta name="description" content="Đặt lịch cắt tóc online — chọn dịch vụ, thợ và giờ còn trống.">
<title>Đặt lịch</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem('memberhub.theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'');
if(t){document.documentElement.dataset.theme=t;document.getElementById('tc').content=t==='light'?'#f6f3ee':'#0f0e0c';}}catch(e){}</script>
<link rel="stylesheet" href="css/style.css?v=efd648f1">
<style>
  body{padding-bottom:40px}
  .bk{max-width:640px;margin:0 auto;padding:20px 16px}
  .bk h1{font-size:24px;margin:6px 0 2px;color:var(--acc)}
  .bk .lead{color:var(--tx2);margin:0 0 16px}
  .bk .card h3 i{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--acc);
                 color:var(--acc-tx);font-style:normal;font-size:13px;margin-right:6px}
  .svlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
  .sv{text-align:left;padding:11px 12px;border-radius:12px;background:var(--bg3);border:2px solid transparent;color:var(--tx)}
  .sv b{display:block;font-size:14.5px}.sv span{font-size:12.5px;color:var(--tx2)}.sv em{display:block;font-style:normal;font-size:12px;color:var(--tx3);margin-top:3px}
  .sv.on{border-color:var(--acc);background:rgba(214,165,74,.14)}
  .days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .day{flex:none;width:62px;padding:8px 0;border-radius:12px;background:var(--bg3);border:2px solid transparent;color:var(--tx);text-align:center}
  .day small{display:block;font-size:11.5px;color:var(--tx2)}.day b{font-size:17px}
  .day.on{border-color:var(--acc);background:rgba(214,165,74,.14)}.day:disabled{opacity:.35}
  .times{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:12px}
  .times .chip{justify-content:center}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .sum{background:var(--bg3);border-radius:12px;padding:12px 14px;margin:12px 0;line-height:1.7}
  .okbig{font-size:46px;text-align:center;color:var(--ok);margin:4px 0}
  .err{color:var(--bad);margin:10px 0 0}
</style>
</head>
<body>
<div class="bk" id="app"><p class="dim">Đang tải…</p></div>
<div id="toast" class="toast" hidden></div>
<script src="js/book.js?v=efd648f1"></script>
</body>
</html>
